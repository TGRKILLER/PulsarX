<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18211d">
  <title>PulsarX Toolkit</title>
  <style>
    :root { color-scheme: dark; --bg: #18211d; --panel: #202b26; --line: #35423a; --text: #edf0e8; --muted: #a0aba0; --lime: #b9f36b; --orange: #ff895e; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
    button, textarea { font: inherit; }
    .shell { width: min(1080px, calc(100% - 40px)); margin: auto; }
    header { height: 70px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 700; font-size: 17px; }
    .mark { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: var(--lime); color: #18211d; }
    .offline { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .offline i { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
    main { padding: 45px 0 55px; }
    .heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    h1 { margin: 0; font-size: clamp(29px, 5vw, 40px); line-height: 1.1; letter-spacing: -.04em; }
    .heading p { margin: 8px 0 0; color: var(--muted); }
    .reset { padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 490px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
    nav { padding: 16px 12px; border-right: 1px solid var(--line); background: #1b2520; }
    .nav-title { padding: 4px 10px 12px; color: #869287; font: 10px/1.4 ui-monospace, monospace; letter-spacing: .09em; text-transform: uppercase; }
    .nav-button { width: 100%; display: flex; align-items: center; gap: 11px; padding: 11px 10px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #bcc5bb; text-align: left; cursor: pointer; }
    .nav-button:hover { background: #ffffff08; color: var(--text); }
    .nav-button[aria-pressed="true"] { border-color: #b9f36b36; background: #b9f36b12; color: var(--lime); }
    .nav-icon { width: 23px; color: inherit; font: 12px ui-monospace, monospace; text-align: center; }
    .nav-number { margin-left: auto; color: #79867b; font: 10px ui-monospace, monospace; }
    .workspace { min-width: 0; padding: 23px; }
    .tool-heading { display: flex; justify-content: space-between; align-items: start; gap: 16px; padding-bottom: 17px; border-bottom: 1px solid var(--line); }
    .tool-heading h2 { margin: 0; font-size: 19px; }
    .tool-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .local-tag { color: var(--lime); font: 10px ui-monospace, monospace; white-space: nowrap; }
    .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; padding-top: 20px; }
    .field label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; color: #c1c9c0; font-size: 12px; }
    .field label span { color: #879287; font: 10px ui-monospace, monospace; }
    textarea { width: 100%; height: 245px; resize: vertical; padding: 13px; border: 1px solid var(--line); border-radius: 4px; outline: none; background: #17201c; color: var(--text); font: 12px/1.65 ui-monospace, monospace; tab-size: 2; }
    textarea:focus { border-color: #b9f36b80; }
    textarea::placeholder { color: #78847a; }
    textarea[readonly] { color: #d3e9bb; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .action { min-height: 37px; padding: 0 13px; border: 1px solid #b9f36b55; border-radius: 4px; background: var(--lime); color: #19221d; font-weight: 650; cursor: pointer; }
    .action:hover { background: #c8fa8b; }
    .action.secondary { border-color: var(--line); background: transparent; color: var(--text); font-weight: 500; }
    .action.secondary:hover { border-color: #879287; background: #ffffff08; }
    .status { min-height: 20px; margin: 11px 0 0; color: var(--muted); font-size: 12px; }
    .status.error { color: var(--orange); }
    footer { display: flex; justify-content: space-between; gap: 15px; padding-top: 15px; border-top: 1px solid var(--line); color: #869287; font-size: 11px; }
    @media (max-width: 700px) {
      .shell { width: min(100% - 28px, 520px); }
      main { padding-top: 32px; }
      .layout { grid-template-columns: 1fr; }
      nav { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line); }
      .nav-title { grid-column: 1 / -1; padding-bottom: 5px; }
      .workspace { padding: 17px; }
      .editors { grid-template-columns: 1fr; }
      textarea { height: 180px; }
    }
    @media (max-width: 390px) { .offline { font-size: 0; } .local-tag { display: none; } footer { flex-direction: column; } }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand"><span class="mark" aria-hidden="true">✳</span>PulsarX</div><span class="offline"><i aria-hidden="true"></i> Offline and ready</span></header>
    <main>
      <div class="heading"><div><h1>Your everyday toolkit.</h1><p>Pick a tool, paste something in, and get on with it.</p></div><button class="reset" id="clear-all" type="button">Clear all</button></div>
      <div class="layout">
        <nav aria-label="Choose a tool">
          <div class="nav-title">Tools</div>
          <button class="nav-button" type="button" data-tool="text" aria-pressed="true"><span class="nav-icon">Aa</span>Text tools<span class="nav-number">01</span></button>
          <button class="nav-button" type="button" data-tool="json" aria-pressed="false"><span class="nav-icon">{ }</span>JSON<span class="nav-number">02</span></button>
          <button class="nav-button" type="button" data-tool="url" aria-pressed="false"><span class="nav-icon">↗</span>URL<span class="nav-number">03</span></button>
          <button class="nav-button" type="button" data-tool="base64" aria-pressed="false"><span class="nav-icon">64</span>Base64<span class="nav-number">04</span></button>
        </nav>
        <section class="workspace" aria-labelledby="tool-title">
          <div class="tool-heading"><div><h2 id="tool-title">Text tools</h2><p id="tool-description">Change case, clean up text, or check your word count.</p></div><span class="local-tag">100% LOCAL</span></div>
          <div class="editors">
            <div class="field"><label for="input">Input <span id="input-count">0 characters</span></label><textarea id="input" spellcheck="false" placeholder="Type or paste your text here…"></textarea></div>
            <div class="field"><label for="output">Output <span id="output-count">Ready when you are</span></label><textarea id="output" readonly spellcheck="false" placeholder="Your result will appear here…"></textarea></div>
          </div>
          <div class="controls" id="controls"></div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>
    <footer><span>Runs entirely in your browser. Your text never leaves this device.</span><span>PulsarX · v1.0</span></footer>
  </div>
  <script>
    const tools = {
      text: {
        title: "Text tools",
        description: "Change case, clean up text, or check your word count.",
        placeholder: "Type or paste your text here…",
        actions: [
          ["UPPERCASE", text => text.toUpperCase()],
          ["lowercase", text => text.toLowerCase()],
          ["Title Case", text => text.toLowerCase().replace(/(^|[\s'-])\p{L}/gu, letter => letter.toUpperCase())],
          ["Count words", text => `${text.trim() ? text.trim().split(/\s+/u).length : 0} words · ${text.length} characters · ${text.split(/\n/u).length} lines`]
        ]
      },
      json: {
        title: "JSON formatter",
        description: "Format JSON for reading, or compact it for sharing.",
        placeholder: '{"hello":"world"}',
        actions: [
          ["Format JSON", text => JSON.stringify(JSON.parse(text), null, 2)],
          ["Minify JSON", text => JSON.stringify(JSON.parse(text))]
        ]
      },
      url: {
        title: "URL encoder",
        description: "Encode text for a URL or decode an encoded string.",
        placeholder: "Paste text or an encoded URL here…",
        actions: [
          ["Encode", text => encodeURIComponent(text)],
          ["Decode", text => decodeURIComponent(text.replace(/\+/gu, " "))]
        ]
      },
      base64: {
        title: "Base64 codec",
        description: "Encode or decode Base64, including Unicode text.",
        placeholder: "Paste text or a Base64 string here…",
        actions: [
          ["Encode", text => btoa(new TextEncoder().encode(text).reduce((binary, byte) => binary + String.fromCharCode(byte), ""))],
          ["Decode", text => new TextDecoder("utf-8", { fatal: true }).decode(Uint8Array.from(atob(text.trim()), char => char.charCodeAt(0)))]
        ]
      }
    };
    const input = document.querySelector("#input");
    const output = document.querySelector("#output");
    const controls = document.querySelector("#controls");
    const status = document.querySelector("#status");
    let activeTool = "text";

    function runAction(action) {
      status.className = "status";
      try {
        const result = action(input.value);
        output.value = result;
        document.querySelector("#output-count").textContent = `${result.length} characters`;
        status.textContent = activeTool === "text" && action === tools.text.actions[3][1] ? result : "Done.";
      } catch (error) {
        output.value = "";
        document.querySelector("#output-count").textContent = "No result";
        status.className = "status error";
        status.textContent = activeTool === "json" ? `Invalid JSON: ${error.message}` : `Could not decode input: ${error.message}`;
      }
    }

    function selectTool(name) {
      activeTool = name;
      const tool = tools[name];
      document.querySelector("#tool-title").textContent = tool.title;
      document.querySelector("#tool-description").textContent = tool.description;
      input.placeholder = tool.placeholder;
      output.value = "";
      document.querySelector("#output-count").textContent = "Ready when you are";
      status.textContent = "";
      controls.replaceChildren(...tool.actions.map(([label, action], index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `action${index ? " secondary" : ""}`;
        button.textContent = label;
        button.addEventListener("click", () => runAction(action));
        return button;
      }));
      document.querySelectorAll(".nav-button").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.tool === name)));
    }

    input.addEventListener("input", () => {
      document.querySelector("#input-count").textContent = `${input.value.length} characters`;
      status.textContent = "";
      status.className = "status";
    });
    document.querySelectorAll(".nav-button").forEach(button => button.addEventListener("click", () => selectTool(button.dataset.tool)));
    document.querySelector("#clear-all").addEventListener("click", () => {
      input.value = "";
      output.value = "";
      document.querySelector("#input-count").textContent = "0 characters";
      document.querySelector("#output-count").textContent = "Ready when you are";
      status.textContent = "";
      input.focus();
    });
    selectTool(activeTool);
  </script>
</body>
</html>
